<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!--tables-->
    <div style="background-color: rgb(238, 144, 192); color: rgb(82, 168, 85);">
    <label for="email">email</label>
    <input type="text" required placeholder="Enter your email" id="email"/>
    <br>
    <label for="password">password</label>
    <input type="password" required placeholder="Enter your password" id="password" oncopy="return false"/>
    <label for="re-enter-password">re-enter password</label>
    <input type="password" required placeholder="Re-enter your password" id="re-enter-password" oncopy="return false"/>
    <br>
    <label for="date">date</label>
    <input type="date" required placeholder="Select a date" id="date"/>
    <input type="radio" id="checkbox"/>
    <p>gender</p>
    <label for="male">male</label>
    <br/>
    <label for="female">female</label>
    <select title="select your country" id="country">
        <option value="india">India</option>
        <option value="usa">USA</option>
        <option value="uk">UK</option>
    </select>
    <button type="submit"><button>submit</button>
    <button type="reset"><button>reset</button>
    </div>
    <!--tables-->
    <table border="1"/>
        <caption>STUDENTS DETAILS</caption>
        <tr>
            <th>Name</th>
            <th>Gender</th>
            <th>Country</th>
            <th>Age</th>
            <th>marks</th>
            <th>rank</th>
    </tr>
    <tr>
        <td>Naresh</td>
        <td>Male</td>
        <td>India</td>
        <td>25</td>
        <td>85</td>
        <td>1</td>
    </tr>
    <tr>
        <td>John</td>
        <td>Male</td>
        <td>USA</td>
        <td>30</td>
        <td>90</td>
        <td>2</td>
    </tr>
    <tr>
        <td>mahesh</td>
        <td>male</td>
        <td>america</td>
        <td>40</td>
        <td>100</td>
        <td>23</td>
    </tr>
</body>
</html>
